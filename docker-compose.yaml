version: '3.8'

services:
  thingsboard:
    image: thingsboard/tb-postgres:latest
    ports:
      - "8080:9090"
      - "1883:1883"
      - "7070:7070"
      - "5683-5688:5683-5688/udp"
    environment:
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres
    networks:
      - thingsboard_network

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - thingsboard_network

  control-panel:
    image: 390403863289.dkr.ecr.us-east-1.amazonaws.com/thingsboard-stack/control-panel:latest
    ports:
      - "5000:5000"
    environment:
      THINGSBOARD_HOST: thingsboard
    networks:
      - thingsboard_network
    depends_on:
      - thingsboard
    restart: unless-stopped

  llm-service:
    image: 390403863289.dkr.ecr.us-east-1.amazonaws.com/thingsboard-stack/llm-service:latest
    ports:
      - "7000:7000"
      - "8000:8000"
    env_file:
      - .env  # Load API keys and sensitive data from .env
    environment:
      OPENAI_PROJECT_API_KEY: ${OPENAI_PROJECT_API_KEY}
      THINGSBOARD_HOST: thingsboard
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: thingsboard
      DB_USER: postgres
      DB_PASSWORD: postgres

    networks:
      - thingsboard_network
    depends_on:
      - thingsboard
    restart: unless-stopped
  
  # actuators-service:
  #   image: 390403863289.dkr.ecr.us-east-1.amazonaws.com/thingsboard-stack/actuators-service:latest
  #   environment:
  #     THINGSBOARD_HOST: thingsboard
  #     TEMPERATURE_ON_THRESHOLD: 100.0
  #     TEMPERATURE_OFF_THRESHOLD: 80.0
  #     MOISTURE_ON_THRESHOLD: 20.0
  #     MOISTURE_OFF_THRESHOLD: 50.0
  #     TEMPERATURE_SENSOR_ID: 2931e100-1161-11f0-b014-dd31a093e686
  #     MOISTURE_SENSOR_ID: 48ad6b30-1161-11f0-b014-dd31a093e686
  #   networks:
  #     - thingsboard_network
  #   depends_on:
  #     - thingsboard
  #   restart: unless-stopped
  new-actuators-service:
    build:
      context: ./actuators/field-monitoring-app  # Path to the directory containing the Dockerfile
      dockerfile: Dockerfile  # Explicitly specify the Dockerfile
    ports:
      - "8100:8090"  # Map port 8100 on the host to port 8090 in the container
    environment:
      THINGSBOARD_HOST: thingsboard
      TEMPERATURE_ON_THRESHOLD: 100.0
      TEMPERATURE_OFF_THRESHOLD: 80.0
      MOISTURE_ON_THRESHOLD: 20.0
      MOISTURE_OFF_THRESHOLD: 50.0
      TEMPERATURE_SENSOR_ID: 2931e100-1161-11f0-b014-dd31a093e686
      MOISTURE_SENSOR_ID: 48ad6b30-1161-11f0-b014-dd31a093e686
    volumes:
      - sqlite-data:/app/data  # Mount a volume for SQLite database
    networks:
      - thingsboard_network
    depends_on:
      - thingsboard
    restart: unless-stopped
volumes:
  postgres-data:
  sqlite-data:

networks:
  thingsboard_network:
    driver: bridge