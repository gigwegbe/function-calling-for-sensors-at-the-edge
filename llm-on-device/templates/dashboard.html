<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Secure ThingsBoard Dashboard</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #294c6e;
            /* Blue background matching ThingsBoard */
            font-family: "Roboto", sans-serif;
        }

        h1 {
            text-align: center;
            color: white;
            /* Match the white logo text */
            padding: 20px;
            margin: 0;
        }

        iframe {
            width: 100%;
            height: 90vh;
            border: none;
        }
    </style>
</head>

<body>
    <h1>Thousand Hills Farm Dashboard</h1>

    <iframe id="tb-dashboard" src="{{ dashboard_url }}"></iframe>

    <script>
        // Inject JWT token into ThingsBoard session
        const jwtToken = "{{ jwt_token }}";

        if (jwtToken) {
            localStorage.setItem('jwt_token', jwtToken);
        } else {
            console.error("Failed to load JWT token.");
        }
    </script>

    <script src="http://localhost:8000/copilot/index.js"></script>
    <script>
        window.addEventListener("chainlit-call-fn", (e) => {
            const { name, args, callback } = e.detail;
            callback("You sent: " + args.msg);
        });
    </script>
    <script>
        window.mountChainlitWidget({
            chainlitServer: "http://localhost:8000",
        });
    </script>

</body>

</html>
